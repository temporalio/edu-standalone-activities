name: Push Instruqt track (Java)

# Keeps the deployed Java Instruqt track in sync with main. Any merge to main that
# touches the Java track content (or the shared receiver it depends on) runs
# `instruqt track push`. Mirrors push-track.yml (Python) but for the Java track.
#
# Setup required (one time): repo secret INSTRUQT_TOKEN (Instruqt service-account
# token for the `temporal` team).

on:
  push:
    branches: [main]
    paths:
      - 'java/instruqt/**'
      - 'java/course-repo/**'
      - 'java/sandbox/**'
      - 'shared/webhook-receiver/**'
  workflow_dispatch:

concurrency:
  group: push-instruqt-track-java
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  push-track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Java sandbox image build (if this commit triggered one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=""
          for _ in $(seq 1 18); do
            run_id=$(gh run list --workflow build-sandbox-java.yml --commit "$GITHUB_SHA" \
              --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
            [ -n "$run_id" ] && break
            sleep 5
          done
          if [ -n "$run_id" ]; then
            echo "Waiting for Java sandbox image build run $run_id ..."
            gh run watch "$run_id" --exit-status
          else
            echo "No Java sandbox image build for this commit (track-only change); continuing."
          fi

      - name: Install Instruqt CLI
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install instruqt/tap/instruqt
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Validate and push track
        working-directory: java/instruqt
        env:
          INSTRUQT_TOKEN: ${{ secrets.INSTRUQT_TOKEN }}
        run: |
          set -euo pipefail
          instruqt config set team temporal
          instruqt track validate
          instruqt track push --force
