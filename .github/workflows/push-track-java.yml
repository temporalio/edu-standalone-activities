name: Push Instruqt track (Java)

# Keeps the deployed Java Instruqt track in sync with main so it is never out of
# date. Any merge to main that touches Java track content triggers a push.
#
# Setup required (one time): a repo secret INSTRUQT_TOKEN with an Instruqt
# service-account token for the `temporal` team.

on:
  push:
    branches: [main]
    paths:
      - 'java/instruqt/**'
      - 'java/course-repo/**'
      - 'java/sandbox/**'
      - 'shared/webhook-receiver/**'
  workflow_dispatch:

concurrency:
  group: push-instruqt-track-java
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  push-track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for sandbox image build (if this commit triggered one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=""
          for _ in $(seq 1 18); do
            run_id=$(gh run list --workflow build-sandbox-java.yml --commit "$GITHUB_SHA" \
              --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
            [ -n "$run_id" ] && break
            sleep 5
          done
          if [ -n "$run_id" ]; then
            echo "Waiting for sandbox image build run $run_id ..."
            gh run watch "$run_id" --exit-status
          else
            echo "No sandbox image build for this commit (track-only change); continuing."
          fi

      - name: Install Instruqt CLI
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install instruqt/tap/instruqt
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Validate and push track
        working-directory: java/instruqt
        env:
          INSTRUQT_TOKEN: ${{ secrets.INSTRUQT_TOKEN }}
        run: |
          set -euo pipefail
          instruqt config set team temporal
          instruqt track validate
          instruqt track push --force
