name: Build sandbox image (Java)

# Builds the Java Instruqt sandbox image and pushes it to GitHub Container Registry
# as the :java-latest tag. Separate from the Python build because the Java image
# needs the repository root as build context (to COPY both java/course-repo and the
# shared webhook receiver).

on:
  push:
    branches:
      - main
    paths:
      - 'java/sandbox/**'
      - 'java/course-repo/**'
      - 'shared/webhook-receiver/**'
      - '.github/workflows/build-sandbox-java.yml'
  pull_request:
    paths:
      - 'java/sandbox/**'
      - 'java/course-repo/**'
      - 'shared/webhook-receiver/**'
      - '.github/workflows/build-sandbox-java.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/temporalio/edu-standalone-activities-sandbox

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push, if not a PR)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          # Repo root context so the Dockerfile can COPY java/course-repo/ AND
          # shared/webhook-receiver/ (the SDK-agnostic receiver).
          context: .
          file: java/sandbox/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:java-latest
            ${{ env.IMAGE }}:java-${{ github.sha }}
          cache-from: type=gha,scope=java
          cache-to: type=gha,mode=max,scope=java
