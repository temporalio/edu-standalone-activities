name: Build sandbox image (Java)

# Builds the Instruqt sandbox image used by the Java standalone-activities track
# and pushes it to GitHub Container Registry under the :java-* tags.
#
# Triggers on changes to the Java Dockerfile, the Java course repo, or the shared
# webhook receiver (all COPY'd into the image at build time). Also on demand.

on:
  push:
    branches:
      - main
    paths:
      - 'java/sandbox/**'
      - 'java/course-repo/**'
      - 'shared/webhook-receiver/**'
      - '.github/workflows/build-sandbox-java.yml'
  pull_request:
    paths:
      - 'java/sandbox/**'
      - 'java/course-repo/**'
      - 'shared/webhook-receiver/**'
      - '.github/workflows/build-sandbox-java.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/temporalio/edu-standalone-activities-sandbox

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push, if not a PR)
        uses: docker/build-push-action@v6
        with:
          # Context is the repo root so the Dockerfile can COPY both
          # java/course-repo/ and shared/webhook-receiver/.
          context: .
          file: java/sandbox/Dockerfile
          # Instruqt sandboxes run linux/amd64. Pin explicitly.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          # Dedicated tag for the devrel-skill track so it never shares the mutable
          # :java-latest tag with another Java track (e.g. PR #60).
          tags: |
            ${{ env.IMAGE }}:java-devrel-skill-latest
            ${{ env.IMAGE }}:java-devrel-skill-${{ github.sha }}
          cache-from: type=gha,scope=java
          cache-to: type=gha,mode=max,scope=java
